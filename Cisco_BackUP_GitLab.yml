---
# ============================================================
# Play 1: Prepare controller-side directories
# ============================================================
- name: Prepare backup workspace
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    local_backup_dir: /var/lib/awx/projects/output/cisco
    job_id: "{{ awx_job_id | default('manual') }}"
    temp_backup_dir: "/tmp/awx-cisco-normalized-{{ job_id }}"

  tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ local_backup_dir }}"
          mode: "0750"
        - path: "{{ temp_backup_dir }}"
          mode: "0700"


# ============================================================
# Play 2: Collect and normalize Cisco configurations
# ============================================================
- name: Collect Cisco Rrunning Configurations
  hosts: cisco
  gather_facts: false
  connection: ansible.netcommon.network_cli
  serial: 10

  vars:
    ansible_network_os: cisco.ios.ios
    job_id: "{{ awx_job_id | default('manual') }}"
    local_backup_dir: /var/lib/awx/projects/output/cisco
    temp_backup_dir: "/tmp/awx-cisco-normalized-{{ job_id }}"

  tasks:
    - name: Validate inventory hostname for backup filename
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "Inventory hostname contains unsupported filename characters."

    - name: Generate unique backup filename
      ansible.builtin.set_fact:
        cisco_backup_filename: >-
          {{ inventory_hostname }}-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.config

    - name: Collect running configuration
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: "{{ local_backup_dir }}"
          filename: "{{ cisco_backup_filename }}"
      register: backup_output
      no_log: true

    - name: Validate backup result
      ansible.builtin.assert:
        that:
          - backup_output.backup_path is defined
          - backup_output.backup_path | length > 0
        fail_msg: "The IOS configuration backup returned no file path."

    - name: Verify backup file exists on controller
      ansible.builtin.stat:
        path: "{{ backup_output.backup_path }}"
      delegate_to: localhost
      register: backup_file_stat

    - name: Validate backup file
      ansible.builtin.assert:
        that:
          - backup_file_stat.stat.exists
          - backup_file_stat.stat.isreg
          - backup_file_stat.stat.size | int > 0
        fail_msg: "Backup file is missing, invalid, or empty."

    - name: Read backup content for validation
      ansible.builtin.slurp:
        src: "{{ backup_output.backup_path }}"
      delegate_to: localhost
      register: backup_validation
      no_log: true

    - name: Validate configuration content
      ansible.builtin.assert:
        that:
          - backup_validation.content | length > 0
          - >-
            (backup_validation.content | b64decode
             | regex_search('(?m)^version\s+\S+|(?m)^hostname\s+\S+|(?m)^!\s*$'))
            is not none
        fail_msg: >-
          Backup content does not resemble a valid Cisco configuration.
          Review the device output and platform-specific format.

    - name: Normalize configuration for version control
      ansible.builtin.copy:
        content: >-
          {{
            backup_validation.content
            | b64decode
            | regex_replace('(?m)^Building configuration\.\.\.\r?\n', '')
            | regex_replace('(?m)^Current configuration\s*:\s*\d+\s+bytes\r?\n', '')
            | regex_replace('(?m)^!\s*Last configuration change at .*\r?\n?', '')
            | regex_replace('(?m)^!\s*NVRAM config last updated at .*\r?\n?', '')
            | regex_replace('(?m)^!Command:\s*show running-config\s*\r?\n?', '')
            | regex_replace('(?m)^!Running configuration last done at:.*\r?\n?', '')
            | regex_replace('(?m)^!Time:.*\r?\n?', '')
            | trim
          }}{{ '\n' }}
        dest: "{{ temp_backup_dir }}/{{ inventory_hostname }}.config"
        mode: "0600"
      delegate_to: localhost
      no_log: true

    - name: Mark backup ready for Git
      ansible.builtin.set_fact:
        backup_ready: true

    - name: Report successful collection
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: configuration collected,
          local timestamped backup preserved, normalized backup ready for Git.


# ============================================================
# Play 3: Commit and push changes to GitLab
# ============================================================
- name: Version-control Cisco backups
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    job_id: "{{ awx_job_id | default('manual') }}"
    temp_backup_dir: "/tmp/awx-cisco-normalized-{{ job_id }}"
    git_repo_url: "git@gitlab.example.local:ip-team/awx-ansible.git"
    git_branch: main
    git_repo_dir: "/tmp/awx-cisco-git-{{ job_id }}"
    git_backup_dir: backups/cisco
    git_author_name: AWX Cisco Backup
    git_author_email: awx-cisco-backup@example.local

  tasks:
    - name: Validate Git configuration
      ansible.builtin.assert:
        that:
          - git_repo_url == 'git@gitlab.example.local:ip-team/awx-ansible.git'
          - git_branch == 'main'
        fail_msg: "Git repository or target branch does not match policy."

    - name: Identify successfully collected devices
      ansible.builtin.set_fact:
        successful_devices: >-
          {{
            groups['cisco']
            | select('in', groups['cisco'])
            | list
            | select('defined')
            | list
          }}

    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_repo_dir }}"
        version: "{{ git_branch }}"
        update: true
        accept_hostkey: false
      register: git_checkout

    - name: Create Git backup directory
      ansible.builtin.file:
        path: "{{ git_repo_dir }}/{{ git_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Copy normalized backups into Git working tree
      ansible.builtin.copy:
        src: "{{ temp_backup_dir }}/{{ item }}.config"
        dest: "{{ git_repo_dir }}/{{ git_backup_dir }}/{{ item }}.config"
        mode: "0644"
      loop: "{{ groups['cisco'] }}"
      when: hostvars[item].backup_ready | default(false) | bool

    - name: Configure Git author
      ansible.builtin.command:
        argv:
          - git
          - config
          - "{{ item.key }}"
          - "{{ item.value }}"
        chdir: "{{ git_repo_dir }}"
      loop:
        - key: user.name
          value: "{{ git_author_name }}"
        - key: user.email
          value: "{{ git_author_email }}"
      changed_when: false

    - name: Stage only Cisco backups
      ansible.builtin.command:
        argv:
          - git
          - add
          - --all
          - --
          - "{{ git_backup_dir }}/"
        chdir: "{{ git_repo_dir }}"
      changed_when: false

    - name: Detect staged changes
      ansible.builtin.command:
        argv:
          - git
          - diff
          - --cached
          - --quiet
        chdir: "{{ git_repo_dir }}"
      register: staged_changes
      changed_when: staged_changes.rc == 1
      failed_when: staged_changes.rc not in [0, 1]

    - name: Commit changed configurations
      ansible.builtin.command:
        argv:
          - git
          - commit
          - -m
          - "Update Cisco configuration backups"
      args:
        chdir: "{{ git_repo_dir }}"
      when: staged_changes.rc == 1

    - name: Push changes to main with bounded concurrency recovery
      ansible.builtin.shell: |
        set -eu

        for attempt in 1 2 3; do
          if git push origin HEAD:main; then
            exit 0
          fi

          if [ "$attempt" -eq 3 ]; then
            echo "Push failed after 3 attempts" >&2
            exit 1
          fi

          git fetch origin main
          git rebase origin/main
        done
      args:
        chdir: "{{ git_repo_dir }}"
        executable: /bin/bash
      when: staged_changes.rc == 1
      register: git_push_result
      changed_when: true

    - name: Report unchanged configuration
      ansible.builtin.debug:
        msg: "No normalized configuration changes; no commit or push required."
      when: staged_changes.rc == 0

    - name: Remove temporary normalized files
      ansible.builtin.file:
        path: "{{ temp_backup_dir }}"
        state: absent

    - name: Remove temporary Git working tree
      ansible.builtin.file:
        path: "{{ git_repo_dir }}"
        state: absent
